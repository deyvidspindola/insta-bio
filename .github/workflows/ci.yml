name: CI

on:
  pull_request:
  push:
    branches: [main, production, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  quality:
    name: Estilo e análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, gd, zip, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PSR-12 (Pint)
        run: ./vendor/bin/pint --test

      - name: Análise estática (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress

  tests:
    name: Testes
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, gd, zip, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test

  assets:
    name: Build dos assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar e buildar
        run: |
          npm ci
          npm run build
